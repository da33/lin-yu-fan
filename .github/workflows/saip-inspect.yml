name: 學校報名系統欄位偵察

# 只讀取空白表單的欄位與選項，不會填寫或送出任何資料
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: earlybird/bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 連線測試
        run: curl -sS -m 30 -o /dev/null -w "HTTP %{http_code}  %{url_effective}\n" -L https://saip.vnu.edu.tw/RevEnt/ || true
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node inspect.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saip-form
          path: earlybird/bot/out/
          retention-days: 7
